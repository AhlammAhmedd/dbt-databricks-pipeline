models: 
  - name: stg_job_postings
    description: >
      One row per posting per scrape day - a job re-scraped across days keeps every row
    columns:
      - name: job_id
        description: The scraper's posting id
      - name: search_term
        description: The role the scraper searched for; exactly three values by construction.
      - name: search_date
        description: Scrape day
      - name: searched_at
        description: Scrape timestamp (search_time renamed)
      - name: search_location
        description: Location parameter the scraper searched under.
      - name: job_title
        description: Posting title as scraped.
      - name: company_name
        description: Employer name, trimmed
      - name: job_location
        description: Posting location as scraped.
      - name: source_platform
        description: Posting platform (job_via with the 'via ' scraper artifact stripped, ~6.3k rows).
      - name: job_schedule_type
        description: >
          As scraped; 12,252 nulls stay null (documented, not fixed). 17 distinct values in
          the wild, including combos like 'Full-time and Part-time' (25,242 rows), so the naive
          four-value test below fails 28,776 rows by design: the 3.09.2 finding, kept visible at
          warn severity instead of silently "fixed".
      - name: job_work_from_home
        description: True when the posting is flagged remote.
      - name: job_posted_at
        description: >
          Raw relative posted time ('10 hours ago'), kept unparsed — search_date carries the
          course's time axis (~95% of rows are scraped within a day of posting); parsing this
          precisely is a supporter exercise.
      - name: job_salary
        description: Raw salary text unparsed for now.
      - name: job_extensions_raw
        description: Raw extensions JSON - the benefits flags live in here 

  - name: stg_job_skills
    description: >
      One row per (job_id skill_id) pair, straight off the raw table.
      Deliberately boring; rename, order, trim is the discipline working.
    columns:
      - name: job_id
        description: Every row's parent exists in stg_job_postings
      - name: skill_id
        description: Skill key for the pair
      - name: skill_keyword
        description: Skill text as extracted, trimmed.